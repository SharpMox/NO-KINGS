name: godot-suite

on:
  workflow_dispatch:
  push:
    branches: [ci/godot-suite-proto]

concurrency:
  group: godot-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GODOT_VERSION: 4.7-stable
      GODOT_ASSET: Godot_v4.7-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/$GODOT_VERSION
          curl -fsSL -o godot.zip "$base/$GODOT_ASSET.zip"
          curl -fsSL -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          echo "$(grep " $GODOT_ASSET.zip\$" SHA512-SUMS.txt | cut -d' ' -f1)  godot.zip" | sha512sum -c -
          unzip -q godot.zip && rm godot.zip SHA512-SUMS.txt
          mv "$GODOT_ASSET" godot && chmod +x godot

      - name: Install Xvfb + Mesa (llvmpipe)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb xauth libgl1 libgl1-mesa-dri libegl1 libglx-mesa0 \
            libxcursor1 libxinerama1 libxrandr2 libxi6 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 mesa-utils

      - name: GL sanity check
        run: xvfb-run -a -s "-screen 0 1280x1024x24" glxinfo -B

      - name: Godot version
        run: ~/godot/godot --version

      - name: Run suite (xvfb)
        env:
          GODOT: /home/runner/godot/godot
        run: |
          start=$(date +%s)
          code=0
          xvfb-run -a -s "-screen 0 1280x1024x24" game/tests/run_all.sh 2>&1 | tee suite.log || code=$?
          echo "suite wall time: $(( $(date +%s) - start ))s (exit $code)" | tee -a suite.log
          exit $code

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-logs
          path: |
            suite.log
            /tmp/tmp.*
          if-no-files-found: ignore
