<!doctype html><html><head><meta charset="utf-8"><style>
 html,body{margin:0;padding:0;background:#231544}
 .fg{width:1024px;height:500px;position:relative;overflow:hidden;background:#2a1a4e}
 img{position:absolute;image-rendering:pixelated;
     filter:drop-shadow(0 2px 3px rgba(20,10,38,.55))}
 .title{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;
   justify-content:flex-end;padding:0 0 34px 46px;
   background:linear-gradient(90deg,rgba(20,12,38,.86) 0%,rgba(20,12,38,.58) 34%,rgba(20,12,38,0) 64%)}
 .title img{position:static;align-self:flex-start;height:400px;width:auto;image-rendering:pixelated;
   filter:drop-shadow(0 3px 10px rgba(0,0,0,.8))}
</style></head><body><div class="fg" id="fg"><div class="title"><img src="/game/assets/icon/title-wordmark.png"></div></div>
<script>
const IDS = ["alibaba", "amazon", "amazonrider", "archbishop", "arrow-pawn", "banshee", "berolina", "bishop", "bodyguard", "buffalo", "champion", "chancellor", "crown-princess", "dragon-horse", "dragon-king", "elephant-modern", "ferz", "gnu", "godzilla", "gryphon", "high-priestess", "inv-arrow-pawn", "inv-kirin-plus", "inv-kirin-plus-plus", "inv-sergeant", "kirin", "kirin-plus", "kirin-plus-plus", "knight", "manticore", "pawn", "queen", "raven", "rook", "sergeant", "squirrel", "war-machine", "wazir"];
// Deterministic: same crowd every render, so the asset is reproducible and a
// new piece can be added by re-rendering rather than editing a PNG.
let s = 20260903;
const rnd = () => (s = (s*1664525 + 1013904223) % 4294967296) / 4294967296;
const fg = document.getElementById('fg');

// UNIFORM SIZE, packed tighter than the art is wide so nothing shows through.
// The tokens carry transparent padding inside their 192px box, so the step has
// to be well under SIZE or the padding reads as gaps.
const SIZE = 132, STEP_X = 70, STEP_Y = 94;
let k = 0, row = 0;
for (let y = -70; y < 560; y += STEP_Y, row++) {
  const brick = (row % 2) * (STEP_X / 2);   // offset alternate rows so the
  let col = 0;
  for (let x = -80; x < 1090; x += STEP_X) { // columns never line up as a grid
    const id = IDS[(k*7 + 3) % IDS.length]; // walk, don't randomise: every
    k++;                                     // piece is guaranteed to appear
    // Side alternates on a checkerboard rather than being rolled per token:
    // a 30% random draw clumps, leaving whole regions all-blue or all-red.
    // The flip chance breaks the regularity without letting it clump again.
    const side = (((row + col) % 2 === 0) !== (rnd() < .24)) ? 'dark' : 'light';
    col++;
    const img = document.createElement('img');
    img.src = `/game/assets/pieces/${id}-${side}.png`;
    img.style.width = img.style.height = SIZE + 'px';
    img.style.left = (x + brick + (rnd()-.5)*16) + 'px';
    img.style.top  = (y + (rnd()-.5)*14) + 'px';
    img.style.transform = `rotate(${(rnd()-.5)*7}deg)`;
    // append, so LATER rows paint on top: a crowd stacks front-over-back, and
    // inserting first put upper rows above lower ones, hiding their heads.
    // .title carries z-index so it still floats above the whole pack.
    fg.appendChild(img);
  }
}
</script></body></html>
