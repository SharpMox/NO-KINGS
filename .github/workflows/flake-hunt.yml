name: flake-hunt

# Nightly: the full suite 5 times on main, in parallel. Any failing run opens
# (or comments on) ONE open issue labelled `flaky`, naming the failing checks
# and linking the job. The goal is zero flaky tests, so a flake that shows up
# once in five gets a ticket instead of a shrug and a rerun.
#
# The run steps mirror godot-suite.yml's `suite` job — keep them in sync. It
# is copied rather than called as a reusable workflow because godot-suite's
# workflow-level concurrency group would queue-and-cancel the 5 calls.
#
# Manual: gh workflow run flake-hunt.yml --ref main

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC nightly (off the top of the hour, when Actions queues are busiest)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flake-hunt
  cancel-in-progress: false

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false # a flake in run 1 must not cancel runs 2-5
      matrix:
        run: [1, 2, 3, 4, 5]
    env:
      GODOT_VERSION: 4.7-stable
      GODOT_ASSET: Godot_v4.7-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v7

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/$GODOT_VERSION
          curl -fsSL -o godot.zip "$base/$GODOT_ASSET.zip"
          curl -fsSL -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          echo "$(grep " $GODOT_ASSET.zip\$" SHA512-SUMS.txt | cut -d' ' -f1)  godot.zip" | sha512sum -c -
          unzip -q godot.zip && rm godot.zip SHA512-SUMS.txt
          mv "$GODOT_ASSET" godot && chmod +x godot

      - name: Install Xvfb + Mesa (llvmpipe)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb xauth libgl1 libgl1-mesa-dri libegl1 libglx-mesa0 \
            libxcursor1 libxinerama1 libxrandr2 libxi6 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1

      - name: Run suite (xvfb)
        env:
          GODOT: /home/runner/godot/godot
        run: |
          set -o pipefail
          code=0
          xvfb-run -a -s "-screen 0 1280x1024x24" game/tests/run_all.sh 2>&1 | tee suite.log || code=$?
          grep -q "^ALL GREEN" suite.log || code=${code/#0/1}
          exit $code

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flake-hunt-${{ matrix.run }}
          retention-days: 14
          path: |
            suite.log
            /tmp/tmp.*
          if-no-files-found: ignore

  report:
    needs: suite
    if: always() && needs.suite.result != 'success' && needs.suite.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: flake-hunt-*
          path: logs

      - name: Open or update the flaky issue
        run: |
          body=$(mktemp)
          {
            echo "Nightly flake hunt on \`${GITHUB_SHA::7}\` ($(date -u +%F)): $RUN_URL"
            echo
            echo "| run | job | failing checks |"
            echo "|---|---|---|"
            gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs?per_page=50" \
              --jq '.jobs[] | select(.name | startswith("suite")) | select(.conclusion != "success") | "\(.name)\t\(.html_url)"' |
            while IFS="$(printf '\t')" read -r name url; do
              n=$(printf '%s' "$name" | grep -o '[0-9]\+' | tail -1)
              log="logs/flake-hunt-$n/suite.log"
              checks=$(grep -h '^FAIL: ' "$log" 2>/dev/null | sed 's/ — full log.*//' | paste -sd ';' -)
              echo "| $n | [job]($url) | ${checks:-no suite.log (setup failed or timed out)} |"
            done
          } > "$body"
          cat "$body"
          gh label create flaky --color B60205 --description "A test that fails intermittently" 2>/dev/null || true
          num=$(gh issue list --label flaky --state open --search "Nightly flake hunt in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file "$body"
          else
            gh issue create --title "Nightly flake hunt: failing checks" --label flaky --body-file "$body"
          fi
