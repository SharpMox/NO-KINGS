  body { background: #17171b; color: #e8e4da; font: 15px/1.4 -apple-system, sans-serif;
         margin: 0 0 120px; }
  h1 { font-size: 19px; margin: 18px 20px 4px; }
  p.hint { margin: 0 20px 14px; color: #9a958a; font-size: 13px; }
  table { border-collapse: collapse; margin: 0 12px; }

  .name { font-weight: 600; white-space: nowrap; }
  .tier { font-size: 11px; padding: 1px 7px; border-radius: 8px; background: #26262c; }
  .Tactical  { color: #40ccd9; }
  .Strategic { color: #ffd94d; }
  .Decisive  { color: #ff7359; }
  .card { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px;
          border: 2px solid #2a2a30; border-radius: 10px; cursor: pointer;
          background: #1d1d22; }
  .card:hover { border-color: #4a4a55; }
  .card.sel { border-color: currentColor; background: #22262c; }
  .card svg { display: block; }
  .tag { font-size: 11px; color: #9a958a; width: 10px; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; background: #101014;
         border-top: 1px solid #2a2a30; padding: 12px 20px; display: flex;
         gap: 14px; align-items: center; }
  #picks { flex: 1; font: 13px ui-monospace, monospace; color: #cfead0;
           overflow-x: auto; white-space: nowrap; }
  #copy { background: #2e6e46; color: #fff; border: 0; border-radius: 8px;
          padding: 8px 16px; font-size: 14px; cursor: pointer; }
  #copy:active { background: #3d8f5c; }
</style>

<table id="t"></table>

<div id="bar">
  <div id="picks">no picks yet</div>
  <button id="copy">Copy</button>
</div>

<script>
const ITEMS = [
  ["blitz", "Blitz", "Tactical"],
  ["asset_recovery", "Asset Recovery", "Tactical"],
  ["demote", "Demote", "Tactical"],
  ["promote", "Promote", "Tactical"],
  ["invert", "Inversion", "Tactical"],
  ["extraction", "Extraction", "Tactical"],
  ["tactical_reposition", "Tactical Reposition", "Tactical"],
  ["air_strike", "Air Strike", "Strategic"],
  ["sniper", "Sniper", "Strategic"],
  ["radar_jamming", "Radar Jamming", "Strategic"],
  ["rapid_deployment", "Rapid Deployment", "Strategic"],
  ["decoy_swap", "Decoy Swap", "Strategic"],
  ["counter_intel", "Counter-Intel", "Strategic"],
  ["drone_strike", "Drone Strike", "Decisive"],
  ["surprise_attack", "Surprise Attack", "Decisive"],
];
// SVG ids use the item KEY (invert's catalog key is "invert" but its icon
// groups are authored as invert-A/B/C above — keys match throughout).
const picks = {};
const t = document.getElementById("t");
for (const [key, name, tier] of ITEMS) {
  const tr = document.createElement("tr");
  let cells = `<td class="name">${name}</td>
    <td><span class="tier ${tier}">${tier}</span></td>`;
  for (const v of ["A", "B", "C"]) {
    cells += `<td><div class="card ${tier}" data-key="${key}" data-v="${v}">
      <span class="tag">${v}</span>
      <svg class="i" width="46" height="46" viewBox="0 0 100 100" fill="currentColor"><use href="#${key}-${v}"/></svg>
      <svg class="i" width="30" height="30" viewBox="0 0 100 100" fill="currentColor"><use href="#${key}-${v}"/></svg>
    </div></td>`;
  }
  tr.innerHTML = cells;
  t.appendChild(tr);
}
t.addEventListener("click", (e) => {
  const card = e.target.closest(".card");
  if (!card) return;
  const key = card.dataset.key;
  document.querySelectorAll(`.card[data-key="${key}"]`).forEach(c => c.classList.remove("sel"));
  card.classList.add("sel");
  picks[key] = card.dataset.v;
  const out = ITEMS.filter(([k]) => picks[k]).map(([k]) => `${k}:${picks[k]}`).join(", ");
  document.getElementById("picks").textContent =
    `${Object.keys(picks).length}/15 — ${out}`;
});
document.getElementById("copy").addEventListener("click", () => {
  navigator.clipboard.writeText(document.getElementById("picks").textContent);
});
</script>
